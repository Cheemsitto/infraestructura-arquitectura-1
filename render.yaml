services:
  - type: web
    name: infraestructura-arquitectura-1
    runtime: node
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://infraestructura-arquitectura-1-five.vercel.app
